name: Ritual Checks
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
jobs:
  check-template:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR description has required sections
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request?.body || "").toLowerCase();
            const needed = ["change note","why","rooms & data","receipts","risk & rollback","test plan","infra-as-code pledge"];
            const have = Array.from(body.matchAll(/^##?\s+(.+)$/gm)).map(m => m[1].trim().toLowerCase());
            const missing = needed.filter(req => !have.some(h => h.includes(req)));
            if (missing.length) core.setFailed(`PR description is missing sections: ${missing.join(", ")}`);